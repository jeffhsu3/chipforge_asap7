[project]
name = "chipforge-asap7"
dynamic = ["version"]
description = "ASAP7 PDK layout primitives (fin/gate grids, layer map) for chipforge."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "jeffhsu3", email = "jeffhsu3@gmail.com"},
]
keywords = ["asap7", "finfet", "gds", "layout", "vlsi", "chipforge", "pdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
# Deliberately empty: the constants and pure-geometry helpers are dependency-free
# so callers that only need pitches / alignment math (LEF, Liberty, sizing, DRC
# scripts) can depend on this without pulling a GDS library.  The draw_* helpers
# need gdspy — install the "gds" extra for those.
dependencies = []

[project.optional-dependencies]
gds = ["gdspy>=1.6.13"]
pex = ["klayout-pex>=0.3.12,<0.4; python_version >= '3.12'"]

[project.scripts]
asap7-inverter = "chipforge_asap7.devices.inverter:main"
asap7-row-support = "chipforge_asap7.devices.row_support:main"
asap7-sense-amp = "chipforge_asap7.devices.sense_amp:main"
asap7-verify = "chipforge_asap7.verification.__main__:main"

[project.urls]
Homepage = "https://github.com/jeffhsu3/chipforge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/chipforge_asap7/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chipforge_asap7"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12",
    "gdspy>=1.6.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
